  #     retries: 10
  #
  # notifications:
  #   build: services/notifications
  #   environment:
  #     RABBITMQ_URL: ${RABBITMQ_URL}
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   restart: always

  # ---- TP7 — dé-commentez : ----------------------------------------------
  # paiement:
  #   build: services/paiement
  #   environment:
  #     RABBITMQ_URL: ${RABBITMQ_URL}
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   restart: always

  # ---- TP8 — À vous : auth + db-auth (port conseillé : 8004:8000) --------

volumes:
  data-user:
  data-livre:
  data-emprunte:
